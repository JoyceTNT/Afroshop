# Baut das Frontend im Demo-Modus und veröffentlicht es auf GitHub Pages.
# Läuft automatisch bei jedem Push auf main (oder manuell über den Tab "Actions").
name: Live-Demo veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die GitHub Pages für die Veröffentlichung braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veröffentlichung gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pakete installieren
        run: npm ci

      - name: Demo bauen
        run: npm run build:demo

      - name: Ergebnis für GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
