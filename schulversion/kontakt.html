    <form action="https://informatik.hs-bremerhaven.de/docker-swe2-2024-team17-web/cgi-bin/kontakt.sh" method="GET">
      <h1>Uns kontaktieren</h1>
      <div class="trennen"> </div>
      <div class="koerper">
        <div class="links">
          <div class="box">
          <label for="name">Name</label>
          <input type="text" id="name" name="name">
          <i class="fas fa-user"></i>
          </div>
          <div class="box">
          <label for="adresse">E-mail Adresse</label>
          <input type="text" id="adresse" name="adresse">
          <i class="fas fa-envelope"></i>
          </div>
          <div class="box">
          <label for="nummer">Telefonnummer</label>
          <input type="text" id="nummer" name="nummer">
          <i class="fas fa-mobile"></i></div>
        </div>
        <div class="rechts">
          <div class="box">
            <label for="nachricht">Nachricht</label>
            <textarea placeholder="Lassen Sie hier ein Kommentar..." id="nachricht" name="nachricht"></textarea> </div>
        </div>
      </div>
      <div class="ende" align="center">
        <button type="submit">Nachricht senden</button>
      </div>
    </form>
